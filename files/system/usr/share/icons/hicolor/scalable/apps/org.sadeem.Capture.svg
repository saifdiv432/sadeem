<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1c33"/>
      <stop offset="55%" stop-color="#442646"/>
      <stop offset="100%" stop-color="#0f4c5c"/>
    </linearGradient>
    <linearGradient id="turqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f4c5c" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Main Squircle Background Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#capBg)" stroke="#e2e8f0" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Screen Snip Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 28 42 L 28 32 C 28 29.8 29.8 28 32 28 L 42 28" fill="none" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 86 28 L 96 28 C 98.2 28 100 29.8 100 32 L 100 42" fill="none" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 28 86 L 28 96 C 28 98.2 29.8 100 32 100 L 42 100" fill="none" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 86 100 L 96 100 C 98.2 100 100 98.2 100 96 L 100 86" fill="none" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Inner Shutter / Lens Ring -->
  <circle cx="64" cy="64" r="28" fill="#18181f" fill-opacity="0.75" stroke="url(#turqGrad)" stroke-width="3"/>
  <circle cx="64" cy="64" r="21" fill="url(#lensGlow)"/>
  <circle cx="64" cy="64" r="10" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Subtle Shutter Aperture Blades -->
  <circle cx="64" cy="64" r="5" fill="#7a1c33"/>

  <!-- Cursor Pointer Icon (Lower Right) -->
  <g transform="translate(68, 66)">
    <path d="M 0 0 L 18 18 L 10 18 L 14 26 L 10 28 L 6 20 L 0 24 Z" fill="#ffffff" stroke="#18181f" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>
