name: build-iso
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v45)"
        required: false
        default: "v45"
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          echo "Disk space after cleanup:"
          df -h

      - name: Install BlueBuild CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | sudo bash

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo mkdir -p /root/.docker
          sudo cp ~/.docker/config.json /root/.docker/config.json
          sudo mkdir -p /root/.config/containers
          sudo cp ~/.docker/config.json /root/.config/containers/auth.json

      - name: Generate ISO
        run: |
          mkdir -p build-output
          sudo bluebuild generate-iso \
            --output-dir build-output \
            --iso-name sadeem-45.iso \
            --variant silverblue \
            image "ghcr.io/saifdiv432/sadeem:45"
          sudo chmod -R 777 build-output

      - name: Calculate Checksum
        run: |
          cd build-output
          ISO_FILE="sadeem-45.iso"
          if [ ! -f "$ISO_FILE" ]; then
            ISO_FILE=$(ls -1 *.iso 2>/dev/null | head -n 1)
          fi

          if [ -z "$ISO_FILE" ] || [ ! -f "$ISO_FILE" ]; then
            echo "Error: No ISO file found in build-output"
            exit 1
          fi

          echo "Generating SHA256 checksum for $ISO_FILE..."
          sha256sum "$ISO_FILE" > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Upload ISO to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 .github/scripts/upload_to_hf.py

      - name: Upload Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadeem-45-checksum
          path: build-output/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn

      - name: Prepare Release Metadata
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v45"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Sadeem 45 (${TAG}) — سديم 45" >> $GITHUB_OUTPUT

          python3 .github/scripts/generate_release_notes.py

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: build-output/RELEASE_NOTES.md
          append_body: false
          fail_on_unmatched_files: false
          files: |
            build-output/SHA256SUMS
