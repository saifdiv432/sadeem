---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sadeem
description: Sadeem 45 - Custom Fedora Atomic Silverblue Image
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Import RPM Fusion GPG signing keys into RPM database
  - type: script
    snippets:
      - "rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion*"

  # Install required multimedia codecs, drivers, fonts, and utilities from Fedora & RPM Fusion
  - type: rpm-ostree
    keys:
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
    remove:
      - gnome-tour
    install:
      # RPM Fusion release packages
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm

      # Hardware acceleration & codecs
      - libavcodec-freeworld
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-plugin-libav
      - mesa-va-drivers-freeworld
      - intel-media-driver

      # Image formats & thumbnails
      - libheif-freeworld
      - heif-pixbuf-loader
      - webp-pixbuf-loader
      - ffmpegthumbnailer

      # Compression & archiving
      - unrar
      - p7zip
      - p7zip-plugins

      # Arabic, office & global fonts
      - google-noto-sans-arabic-fonts
      - vazirmatn-fonts
      - amiri-fonts
      - google-carlito-fonts
      - google-crosextra-caladea-fonts
      - liberation-fonts
      - google-noto-nastaliq-urdu-fonts
      - google-noto-sans-devanagari-fonts
      - google-noto-sans-cjk-vf-fonts

      # Localization & 12 language packs
      - langpacks-en
      - langpacks-ar
      - langpacks-ru
      - langpacks-es
      - langpacks-tr
      - langpacks-fr
      - langpacks-it
      - langpacks-hi
      - langpacks-zh_CN
      - langpacks-ur
      - langpacks-ms
      - langpacks-id
      - glibc-langpack-ar
      - gnome-menus
      - adw-gtk3-theme
      - gnome-shell-extension-user-theme
      - gnome-shell-extension-light-style
      - fastfetch
      - librsvg2-tools

      # Hardware detection & Secure Boot management
      - pciutils
      - mokutil

      # Rumman media converters & processors (ffmpeg is provided by pre-installed ffmpeg-free + libavcodec-freeworld)
      - ImageMagick
      - ghostscript
      - poppler-utils
      - python3-cairo
      - python3-pillow

      # Container sandbox & compatibility runtime
      - distrobox

  # System-wide Flatpaks configuration (disables Fedora remote and enables Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          - org.videolan.VLC
          - page.tesk.Refine
          - com.usebottles.bottles
          - net.davidotek.pupgui2
          - io.github.dvlv.boxbuddyrs

  # Enable flatpak system services and user systemd units
  - type: systemd
    system:
      enabled:
        - flatpak-configure-languages.service
        - saifdora-theme-overrides.service
    user:
      enabled:
        - saifdora-flatpak-dbus-reload.path
        - saifdora-apply-theme.service
        - saifdora-accent-watcher.service
        - sadeem-init-sandbox.service

  # Compile dconf defaults, glib schemas, update MIME database, update logos and icon cache, fastfetch hook, and customize os-release
  - type: script
    snippets:
      - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
      - "dconf update"
      - "update-desktop-database /usr/share/applications || true"
      - |
        for OS_REL in /usr/lib/os-release /etc/os-release; do
          if [ -f "$OS_REL" ] && [ ! -L "$OS_REL" ]; then
            sed -i 's|^NAME=.*|NAME="Sadeem"|' "$OS_REL"
            sed -i 's|^PRETTY_NAME=.*|PRETTY_NAME="Sadeem 45"|' "$OS_REL"
            sed -i 's|^DEFAULT_HOSTNAME=.*|DEFAULT_HOSTNAME="sadeem"|' "$OS_REL"
            if grep -q '^LOGO=' "$OS_REL"; then
              sed -i 's|^LOGO=.*|LOGO=sadeem-logo|' "$OS_REL"
            else
              echo 'LOGO=sadeem-logo' >> "$OS_REL"
            fi
            if grep -q '^ANSI_COLOR=' "$OS_REL"; then
              sed -i 's|^ANSI_COLOR=.*|ANSI_COLOR="0;38;2;122;28;51"|' "$OS_REL"
            else
              echo 'ANSI_COLOR="0;38;2;122;28;51"' >> "$OS_REL"
            fi
          fi
        done
        ln -sf ../usr/lib/os-release /etc/os-release

        mkdir -p /usr/share/pixmaps /usr/share/plymouth/themes/spinner /usr/share/icons/hicolor/scalable/apps
        cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-icon.svg
        cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/distributor-logo.svg
        cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/distributor-logo-fedora.svg
        cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-text-dark.svg
        cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-text.svg
        rsvg-convert -w 128 -h 128 /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg -o /usr/share/plymouth/themes/spinner/watermark.png
        rsvg-convert -w 128 -h 128 /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg -o /usr/share/pixmaps/fedora-logo-sprite.png
        rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg -o /usr/share/pixmaps/fedora-gdm-logo.png
        rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg -o /usr/share/pixmaps/fedora-logo.png
        rsvg-convert -w 220 -h 65 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg -o /usr/share/pixmaps/fedora-logo-small.png
        rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg -o /usr/share/pixmaps/system-logo-white.png
        gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true

        # Safely remove gnome-tweaks if present in base image
        rpm -q gnome-tweaks >/dev/null 2>&1 && rpm -e --nodeps gnome-tweaks || true
        dconf update || true
        chmod +x /usr/bin/sadeem-colors /usr/bin/sadeem-welcome /usr/bin/saifdora-accent-watcher /usr/bin/sadeem-init-sandbox /usr/bin/sadeem-pkg-installer || true

  # Regenerate initramfs to update boot splash and Plymouth watermark
  - type: initramfs

  # Container signing policy configuration
  - type: signing
