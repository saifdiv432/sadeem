---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sadeem
description: Sadeem 45 - Custom Fedora Atomic Silverblue Image
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 45

modules:
  # ============================================================================
  # 1. HEAVY & STATIC PACKAGES LAYER (rpm-ostree)
  # Cached permanently across builds unless packages or base Fedora version changes.
  # ============================================================================
  # 1.1 Enable RPM Fusion repositories first
  - type: rpm-ostree
    keys:
      - https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-free-fedora-2020
      - https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    install:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm

  # 1.2 Remove unwanted base packages and install required packages, codecs, drivers, fonts & utilities
  - type: rpm-ostree
    remove:
      - gnome-tour
      - firefox
      - firefox-langpacks
    install:
      # Hardware acceleration & codecs
      - libavcodec-freeworld
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-plugin-libav
      - intel-media-driver

      # Image formats & thumbnails
      - libheif-freeworld
      - heif-pixbuf-loader
      - webp-pixbuf-loader
      - ffmpegthumbnailer

      # Compression & archiving
      - unrar
      - p7zip
      - p7zip-plugins

      # Arabic, office & global fonts
      - google-noto-sans-arabic-fonts
      - vazirmatn-fonts
      - amiri-fonts
      - google-carlito-fonts
      - google-crosextra-caladea-fonts
      - liberation-fonts
      - google-noto-nastaliq-urdu-fonts
      - google-noto-sans-devanagari-fonts
      - google-noto-sans-cjk-vf-fonts

      # Localization & 12 language packs
      - langpacks-en
      - langpacks-ar
      - langpacks-ru
      - langpacks-es
      - langpacks-tr
      - langpacks-fr
      - langpacks-it
      - langpacks-hi
      - langpacks-zh_CN
      - langpacks-ur
      - langpacks-ms
      - langpacks-id
      - glibc-langpack-ar
      - gnome-menus
      - adw-gtk3-theme
      - gnome-shell-extension-user-theme
      - gnome-shell-extension-light-style
      - fastfetch
      - librsvg2-tools

      # Hardware detection, firmware updates & Secure Boot management
      - pciutils
      - usbutils
      - fwupd
      - mokutil

      # Rumman media converters & processors (ffmpeg is provided by pre-installed ffmpeg-free + libavcodec-freeworld)
      - ImageMagick
      - ghostscript
      - poppler-utils
      - python3-cairo
      - python3-pillow

      # Container sandbox & compatibility runtime
      - distrobox

  # Best-effort installation of mesa-va-drivers-freeworld (non-blocking on RPM Fusion Mesa version skew)
  - type: script
    snippets:
      - "rpm-ostree install mesa-va-drivers-freeworld || echo 'Skipping mesa-va-drivers-freeworld due to temporary Mesa version skew'"

  # ============================================================================
  # 2. STATIC SYSTEM CONFIGURATIONS & FLATPAKS
  # ============================================================================
  # System-wide Flatpaks configuration (disables Fedora remote and enables Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - org.mozilla.firefox
          - org.gnome.TextEditor
          - org.libreoffice.LibreOffice
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          - org.videolan.VLC
          - page.tesk.Refine
          - com.usebottles.bottles
          - net.davidotek.pupgui2
          - io.github.dvlv.boxbuddyrs
          - it.mijorus.gearlever

  # Enable flatpak system services and user systemd units
  - type: systemd
    system:
      enabled:
        - flatpak-configure-languages.service
        - saifdora-theme-overrides.service
        - sadeem-flatpak-setup.service
    user:
      enabled:
        - saifdora-flatpak-dbus-reload.path
        - saifdora-apply-theme.service
        - saifdora-accent-watcher.service
        - sadeem-init-sandbox.service
        - sadeem-updater-check.timer

  # Static system branding, sound theme generation, and Plymouth defaults
  - type: script
    snippets:
      - |
        for OS_REL in /usr/lib/os-release /etc/os-release; do
          if [ -f "$OS_REL" ] && [ ! -L "$OS_REL" ]; then
            sed -i 's|^NAME=.*|NAME="Sadeem"|' "$OS_REL"
            sed -i 's|^PRETTY_NAME=.*|PRETTY_NAME="Sadeem 45"|' "$OS_REL"
            sed -i 's|^DEFAULT_HOSTNAME=.*|DEFAULT_HOSTNAME="sadeem"|' "$OS_REL"
            if grep -q '^LOGO=' "$OS_REL"; then
              sed -i 's|^LOGO=.*|LOGO=sadeem-logo|' "$OS_REL"
            else
              echo 'LOGO=sadeem-logo' >> "$OS_REL"
            fi
            if grep -q '^ANSI_COLOR=' "$OS_REL"; then
              sed -i 's|^ANSI_COLOR=.*|ANSI_COLOR="0;38;2;122;28;51"|' "$OS_REL"
            else
              echo 'ANSI_COLOR="0;38;2;122;28;51"' >> "$OS_REL"
            fi
          fi
        done
        ln -sf ../usr/lib/os-release /etc/os-release

        # Configure Anaconda product name and branding
        mkdir -p /etc/anaconda/product.d
        for CONF in /etc/anaconda/product.d/*.conf /usr/share/anaconda/product.d/*.conf /etc/anaconda/product.conf; do
          if [ -f "$CONF" ]; then
            sed -i 's|product_name = .*|product_name = Sadeem 45|g' "$CONF"
          fi
        done
        echo -e "[Product]\nproduct_name = Sadeem 45" > /etc/anaconda/product.d/sadeem.conf

        # Remove restricted Fedora flatpak remotes and ensure Flathub is configured system-wide
        flatpak remote-delete --system --force fedora 2>/dev/null || true
        flatpak remote-delete --system --force fedora-testing 2>/dev/null || true
        rm -f /etc/flatpak/remotes.d/fedora*.flatpakrepo 2>/dev/null || true
        flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true
        flatpak override --system --talk-name=org.freedesktop.portal.WebExtensions --talk-name=org.freedesktop.Flatpak org.mozilla.firefox 2>/dev/null || true

        # Plymouth theme defaults
        mkdir -p /usr/share/pixmaps /usr/share/plymouth/themes/spinner /usr/share/icons/hicolor/scalable/apps /etc/plymouth
        echo -e "[Daemon]\nTheme=spinner\nShowDelay=0\nDeviceTimeout=8" > /etc/plymouth/plymouthd.conf
        echo -e "[Daemon]\nTheme=spinner\nShowDelay=0\nDeviceTimeout=8\nUseSimpledrmNoLuks=1" > /usr/share/plymouth/plymouthd.defaults
        for THEME_FILE in /usr/share/plymouth/themes/spinner/spinner.plymouth /usr/share/plymouth/themes/bgrt/bgrt.plymouth; do
          if [ -f "$THEME_FILE" ]; then
            sed -i 's/BackgroundStartColor=.*/BackgroundStartColor=0x111111/' "$THEME_FILE"
            sed -i 's/BackgroundEndColor=.*/BackgroundEndColor=0x111111/' "$THEME_FILE"
            sed -i 's/UseProgressBar=true/UseProgressBar=false/' "$THEME_FILE"
          fi
        done
        if [ -f /usr/share/plymouth/themes/tribar/tribar.plymouth ]; then
          sed -i 's/ModuleName=tribar/ModuleName=text/' /usr/share/plymouth/themes/tribar/tribar.plymouth || true
        fi
        plymouth-set-default-theme spinner || true

        # Generate Sadeem sound theme files if needed
        mkdir -p /usr/share/sounds/sadeem/stereo
        python3 -c '
        import math, struct, wave, subprocess, tempfile, os
        dest = "/usr/share/sounds/sadeem/stereo"
        def save_snd(name, samples, rate=44100):
            target = os.path.join(dest, name)
            if os.path.isfile(target): return
            with tempfile.NamedTemporaryFile(suffix=".wav", delete=False) as tf:
                wpath = tf.name
            with wave.open(wpath, "wb") as wf:
                wf.setnchannels(2)
                wf.setsampwidth(2)
                wf.setframerate(rate)
                raw = bytearray()
                for s in samples:
                    val = int(max(-1.0, min(1.0, s)) * 32767)
                    raw.extend(struct.pack("<hh", val, val))
                wf.writeframes(raw)
            subprocess.run(["ffmpeg", "-y", "-i", wpath, "-c:a", "libvorbis", "-q:a", "4", target], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
            try: os.remove(wpath)
            except: pass

        rate = 44100
        samples = [0.0] * int(rate * 1.6)
        for freq, st, dur, amp, dec in [(392.00, 0.0, 1.2, 0.18, 3.0), (523.25, 0.25, 1.1, 0.20, 2.8), (659.25, 0.50, 1.1, 0.22, 2.5)]:
            for i in range(int(rate * dur)):
                t = i / rate
                v = amp * (math.sin(2 * math.pi * freq * t) + 0.15 * math.sin(4 * math.pi * freq * t)) * math.exp(-dec * t)
                if int(rate * st) + i < len(samples): samples[int(rate * st) + i] += v
        save_snd("desktop-login.oga", samples)

        save_snd("audio-volume-change.oga", [0.15 * math.sin(2 * math.pi * 950 * (i/rate)) * math.exp(-120 * (i/rate)) for i in range(int(rate * 0.04))])

        samples = [0.0] * int(rate * 0.65)
        for freq, st, dur, amp, dec in [(783.99, 0.0, 0.5, 0.18, 5.0), (1046.50, 0.08, 0.55, 0.20, 4.5)]:
            for i in range(int(rate * dur)):
                if int(rate * st) + i < len(samples): samples[int(rate * st) + i] += amp * math.sin(2 * math.pi * freq * (i/rate)) * math.exp(-dec * (i/rate))
        save_snd("message-new-instant.oga", samples)
        save_snd("bell.oga", samples)

        samples = [0.0] * int(rate * 1.2)
        for freq, st, dur, amp, dec in [(523.25, 0.0, 0.9, 0.16, 3.5), (659.25, 0.0, 0.9, 0.15, 3.5), (783.99, 0.12, 1.0, 0.20, 3.0)]:
            for i in range(int(rate * dur)):
                if int(rate * st) + i < len(samples): samples[int(rate * st) + i] += amp * math.sin(2 * math.pi * freq * (i/rate)) * math.exp(-dec * (i/rate))
        save_snd("complete.oga", samples)

        samples = [0.0] * int(rate * 0.8)
        for freq, st, dur, amp, dec in [(349.23, 0.0, 0.6, 0.20, 4.0), (329.63, 0.15, 0.65, 0.22, 3.8)]:
            for i in range(int(rate * dur)):
                if int(rate * st) + i < len(samples): samples[int(rate * st) + i] += amp * math.sin(2 * math.pi * freq * (i/rate)) * math.exp(-dec * (i/rate))
        save_snd("dialog-warning.oga", samples)
        save_snd("dialog-error.oga", samples)
        ' || true

  # ============================================================================
  # 3. EXTERNAL APPS INSTALLER
  # Fetches latest ZapFast and Mister Download Manager binaries from GitHub releases
  # ============================================================================
  - type: script
    scripts:
      - install-external-apps.sh

  # Base image adjustments and cleanup
  - type: script
    snippets:
      - |
        # Safely remove gnome-tweaks if present in base image
        rpm -q gnome-tweaks >/dev/null 2>&1 && rpm -e --nodeps gnome-tweaks || true

        # Firefox kiosk top bar styling for Anaconda WebUI
        for UC in /usr/share/anaconda/firefox-theme/*/chrome/userChrome.css; do
          if [ -f "$UC" ]; then
            sed -i -E 's/#(294172|3c6eb4|0066cc|0055aa|51a2da|0088ce|06c)/#7a1c33/gI' "$UC" || true
            echo -e "\n:root, #navigator-toolbox, #titlebar, #TabsToolbar, #nav-bar, .titlebar-color { background-color: #7a1c33 !important; background-image: none !important; color: #ffffff !important; }\n" >> "$UC" || true
          fi
        done

  # ============================================================================
  # 4. SADEEM SYSTEM FILES & ASSETS
  # Placed after heavy package installations and scripts
  # ============================================================================
  - type: files
    files:
      - source: system
        destination: /

  # Post-copy setup: recompile schemas, update dconf, and finalize branding/permissions
  - type: script
    snippets:
      - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
      - "dconf update"
      - "update-desktop-database /usr/share/applications || true"
      - |
        # Apply Sadeem burgundy CSS to Cockpit Shell, Firefox kiosk theme, and Anaconda WebUI
        if [ -f /usr/share/sadeem/cockpit-branding.css ]; then
          for CSS_FILE in /usr/share/cockpit/branding/fedora/branding.css /usr/share/cockpit/branding/*/*.css /usr/share/cockpit/shell/shell.css /usr/share/cockpit/shell/*.css; do
            if [ -f "$CSS_FILE" ]; then
              echo -e "\n/* Sadeem Burgundy Cockpit Top Bar */\n" >> "$CSS_FILE"
              cat /usr/share/sadeem/cockpit-branding.css >> "$CSS_FILE"
              gzip -kf "$CSS_FILE" 2>/dev/null || true
            fi
          done
        fi
        if [ -f /usr/share/sadeem/anaconda-burgundy.css ]; then
          for CSS_FILE in /usr/share/cockpit/anaconda/*.css /usr/share/cockpit/anaconda-webui/*.css /usr/share/anaconda/*.css; do
            if [ -f "$CSS_FILE" ]; then
              echo -e "\n/* Sadeem Burgundy Anaconda WebUI Theme */\n" >> "$CSS_FILE"
              cat /usr/share/sadeem/anaconda-burgundy.css >> "$CSS_FILE"
              gzip -kf "$CSS_FILE" 2>/dev/null || true
            fi
          done
          for HTML_FILE in /usr/share/cockpit/anaconda/*.html /usr/share/cockpit/anaconda-webui/*.html /usr/share/cockpit/anaconda/index.html /usr/share/anaconda/*.html; do
            if [ -f "$HTML_FILE" ] && ! grep -q "anaconda-burgundy.css" "$HTML_FILE"; then
              sed -i 's|</head>|<link rel="stylesheet" href="/usr/share/sadeem/anaconda-burgundy.css">\n</head>|' "$HTML_FILE" 2>/dev/null || true
            fi
          done
        fi

        # Plymouth watermark and distributor logos
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-icon.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/distributor-logo.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/icons/hicolor/scalable/apps/distributor-logo-fedora.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-text-dark.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg /usr/share/icons/hicolor/scalable/apps/fedora-logo-text.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && rsvg-convert -w 128 -h 128 /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg -o /usr/share/plymouth/themes/spinner/watermark.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && rsvg-convert -w 128 -h 128 /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg -o /usr/share/pixmaps/fedora-logo-sprite.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo.svg /usr/share/pixmaps/fedora-logo-sprite.svg || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg ] && rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg -o /usr/share/pixmaps/fedora-gdm-logo.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg ] && rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg -o /usr/share/pixmaps/fedora-logo.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg ] && rsvg-convert -w 220 -h 65 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg -o /usr/share/pixmaps/fedora-logo-small.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg ] && rsvg-convert -w 340 -h 101 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg -o /usr/share/pixmaps/system-logo-white.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg ] && rsvg-convert -w 280 -h 83 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text.svg -o /usr/share/pixmaps/fedora_logo_med.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg ] && rsvg-convert -w 280 -h 83 /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg -o /usr/share/pixmaps/fedora_whitelogo_med.png || true
        [ -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg ] && cp -f /usr/share/icons/hicolor/scalable/apps/sadeem-logo-text-dark.svg /usr/share/pixmaps/fedora_whitelogo.svg || true
        gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
        plymouth-set-default-theme spinner || true

        mkdir -p /usr/lib/systemd/user/timers.target.wants && ln -sf ../sadeem-housekeeping.timer /usr/lib/systemd/user/timers.target.wants/sadeem-housekeeping.timer && ln -sf ../sadeem-updater-check.timer /usr/lib/systemd/user/timers.target.wants/sadeem-updater-check.timer || true
        rm -f /usr/share/applications/sadeem-system.desktop /usr/share/applications/sadeem-welcome.desktop /etc/xdg/autostart/sadeem-welcome.desktop || true
        chmod +x /usr/bin/sadeem-colors /usr/bin/sadeem-welcome /usr/bin/sadeem-updater /usr/bin/saifdora-accent-watcher /usr/bin/sadeem-init-sandbox /usr/bin/sadeem-pkg-installer /usr/bin/sadeem-system /usr/bin/saifdora-nvidia-manager /usr/bin/sadeem-housekeeping /usr/bin/sadeem-ai-manager /usr/bin/zapfast /usr/bin/misterdownloadmanager* /usr/share/zapfast/zapfast /etc/skel/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts/misterdownloadmanager-flatpak-bridge || true

  # ============================================================================
  # 5. FINAL BOOT CONFIGURATION
  # Regenerate initramfs to update boot splash and Plymouth watermark
  # ============================================================================
  - type: initramfs

  # ============================================================================
  # 6. SIGNING
  # ============================================================================
  # Container signing policy configuration
  - type: signing
